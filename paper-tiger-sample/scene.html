<!doctype html>
<html><head><meta charset="utf-8"><title>Paper Tiger Sample</title>
<style>html,body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;height:100%}canvas{max-width:100vw;max-height:100vh}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Paper-cutout animation drawn entirely in code. Every frame is a pure function of time t.
const W = 1280, H = 720, FPS = 24, DURATION = 6;
const cv = document.getElementById('c'), g = cv.getContext('2d');

// --- deterministic noise ---
function hash(n){ n = Math.sin(n*127.1+311.7)*43758.5453; return n - Math.floor(n); }
function noise1(x, seed){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return hash(i+seed*17.3)*(1-u)+hash(i+1+seed*17.3)*u; }

// --- grain overlay (paper fibers) built once ---
const grain = document.createElement('canvas'); grain.width=W; grain.height=H;
(()=>{ const gc=grain.getContext('2d'), id=gc.createImageData(W,H);
  for(let i=0;i<id.data.length;i+=4){ const v=200+hash(i*0.37)*55; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  gc.putImageData(id,0,0);
  gc.globalAlpha=0.08; gc.strokeStyle='#fff';
  for(let k=0;k<900;k++){ const x=hash(k)*W, y=hash(k+.5)*H, a=hash(k+.9)*6.28, l=6+hash(k+.2)*18;
    gc.beginPath(); gc.moveTo(x,y); gc.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); gc.stroke(); }
})();

// --- torn-paper path: subdivide polygon, jitter edges. "boil" changes every 2 frames (stop-motion on twos)
let BOIL = 0;
function tornPath(pts, seed, amp=2.2, step=7){
  g.beginPath(); let first=true;
  for(let i=0;i<pts.length;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[(i+1)%pts.length];
    const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    const n=Math.max(1,Math.ceil(len/step));
    for(let s=0;s<n;s++){
      const u=s/n, k=seed*31+i*7+s;
      const j=(noise1(k*0.9,seed)-.5)*amp*2 + (hash(k+BOIL*13.1)-.5)*amp*0.9;
      const x=x0+dx*u+nx*j, y=y0+dy*u+ny*j;
      first ? (g.moveTo(x,y), first=false) : g.lineTo(x,y);
    }
  }
  g.closePath();
}
function ellipsePts(cx,cy,rx,ry,n=40){ const p=[]; for(let i=0;i<n;i++){const a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]);} return p; }

// a cut piece: white torn core, colored face, soft drop shadow
function piece(pts, color, seed, {shadow=6, amp=2.2}={}){
  g.save();
  g.shadowColor='rgba(40,25,10,0.35)'; g.shadowBlur=shadow*1.6; g.shadowOffsetX=shadow*0.5; g.shadowOffsetY=shadow;
  g.fillStyle='#fbf6ea'; tornPath(pts, seed+0.5, amp*1.3); g.fill();
  g.restore();
  g.fillStyle=color; tornPath(pts.map(([x,y])=>[x,y]), seed, amp);
  g.save(); g.clip();
  g.fill();
  g.restore();
}

// --- scene pieces ---
function hill(baseY, height, freq, seed, color, scroll){
  const pts=[[-40,H+40]];
  for(let x=-40;x<=W+40;x+=30){ const y=baseY - height*noise1((x+scroll)*freq, seed) - height*0.4*Math.sin((x+scroll)*freq*2.3+seed); pts.push([x,y]); }
  pts.push([W+40,H+40]);
  piece(pts,color,seed,{shadow:8, amp:2.6});
}
function tree(x,y,s,seed,color){
  piece([[x-4*s,y],[x+4*s,y],[x+3*s,y-30*s],[x-3*s,y-30*s]],'#6b4a2e',seed+1,{shadow:4});
  piece([[x,y-95*s],[x+26*s,y-25*s],[x-26*s,y-25*s]],color,seed,{shadow:5});
  piece([[x,y-120*s],[x+19*s,y-62*s],[x-19*s,y-62*s]],color,seed+2,{shadow:5});
}

function tiger(x, y, t){
  const ph = t*Math.PI*2*1.6;           // walk cycle
  const bob = Math.abs(Math.sin(ph))*-5;
  const ORANGE='#e8862a', DARK='#2b1d14', CREAM='#f4e3c3';
  g.save(); g.translate(x, y+bob);
  // legs: far pair first (darker), then body, then near pair
  const leg=(hx, ang, col, sd)=>{ g.save(); g.translate(hx,10); g.rotate(ang);
    piece([[-11,0],[11,0],[9,58],[-12,58]], col, sd, {shadow:4});
    piece([[-13,50],[13,50],[15,64],[-14,64]], CREAM, sd+3, {shadow:2, amp:1.4}); g.restore(); };
  leg(-55, Math.sin(ph+Math.PI)*0.45, '#c86d1e', 51);
  leg( 45, Math.sin(ph)*0.45, '#c86d1e', 52);
  // tail
  g.save(); g.translate(-85,-10); g.rotate(-0.6+Math.sin(ph*0.5)*0.25);
  piece([[0,-6],[0,6],[-70,-20],[-74,-32]], ORANGE, 60, {shadow:4});
  piece([[-55,-14],[-62,-20],[-74,-34],[-70,-19]], DARK, 61, {shadow:1, amp:1});
  g.restore();
  // body
  piece(ellipsePts(0,0,95,42), ORANGE, 70);
  piece(ellipsePts(5,22,70,16), CREAM, 71, {shadow:2});
  for(let i=0;i<5;i++){ const sx=-60+i*28; piece([[sx-6,-40],[sx+6,-40],[sx+2,-8],[sx-3,-12]], DARK, 80+i, {shadow:1, amp:1.2}); }
  leg(-40, Math.sin(ph)*0.45, ORANGE, 53);
  leg( 60, Math.sin(ph+Math.PI)*0.45, ORANGE, 54);
  // head
  g.save(); g.translate(100,-30); g.rotate(Math.sin(ph)*0.05);
  piece([[-22,-30],[-8,-58],[4,-30]], ORANGE, 90, {shadow:3});
  piece([[14,-30],[28,-56],[38,-26]], ORANGE, 91, {shadow:3});
  piece(ellipsePts(8,0,44,38), ORANGE, 92);
  piece(ellipsePts(26,16,24,15), CREAM, 93, {shadow:2});
  piece([[ -20,-24],[-12,-26],[-14,-6]], DARK, 94, {shadow:1, amp:1});
  piece([[ 8,-38],[14,-38],[11,-22]], DARK, 95, {shadow:1, amp:1});
  // eye blinks around t=3.2
  const blink = Math.abs(t-3.2)<0.08;
  piece(blink? [[14,-8],[26,-8],[26,-5],[14,-5]] : ellipsePts(20,-6,5,6,12), DARK, 96, {shadow:1, amp:0.6});
  piece(ellipsePts(46,8,7,5,12), '#4a2a1a', 97, {shadow:1, amp:0.6});
  g.restore();
  g.restore();
}

function ease(x){ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); }

function renderFrame(t){
  BOIL = Math.floor(t*12); // 12 changes/sec = on twos at 24fps
  g.setTransform(1,0,0,1,0,0);
  // sky paper
  const sky=g.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#f6d9a8'); sky.addColorStop(1,'#f1b98a');
  g.fillStyle=sky; g.fillRect(0,0,W,H);
  // sun rises slightly
  const sunY = 250 - ease(t/DURATION)*60;
  piece(ellipsePts(930,sunY,90,90,48), '#e65a3a', 5, {shadow:6});
  // clouds drift
  for(let i=0;i<3;i++){ const cx=((i*480 + t*25) % (W+300)) - 150, cy=110+i*45;
    piece(ellipsePts(cx,cy,80,22,30), '#fbf1de', 10+i, {shadow:4}); }
  const cam = t*90; // parallax
  hill(470, 120, 0.004, 1, '#b9785a', cam*0.2);
  hill(540, 90, 0.006, 2, '#8f6a4f', cam*0.45);
  for(let i=0;i<7;i++){ const tx=((i*230 - cam*0.7) % (W+200) + W+200) % (W+200) - 100; tree(tx, 560, 0.9, 20+i, i%2?'#4f6b3a':'#3e5a30'); }
  hill(630, 50, 0.008, 3, '#5d7a3e', cam);
  // tiger walks in from the left and settles center
  const tx = -200 + ease(t/4.2)*780;
  tiger(tx, 585, t);
  hill(740, 40, 0.012, 4, '#3f5c2b', cam*1.3);
  // title card
  const a = ease((t-4.3)/0.8);
  if(a>0){ g.save(); g.globalAlpha=a; g.translate(W/2, 120 - (1-a)*20);
    piece([[-230,-48],[230,-52],[226,46],[-226,50]], '#fbf6ea', 99, {shadow:8});
    g.fillStyle='#2b1d14'; g.font='bold 56px Georgia, serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('Paper Tiger', 0, 2); g.restore(); }
  // grain + vignette
  g.save(); g.globalCompositeOperation='multiply'; g.globalAlpha=0.55; g.drawImage(grain,0,0); g.restore();
  const v=g.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.95); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(40,20,0,0.35)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
}
window.renderFrame = renderFrame; window.FPS=FPS; window.DURATION=DURATION;

// live preview when opened in a browser
if(!location.search.includes('render')){
  const start=performance.now();
  (function loop(){ const t=((performance.now()-start)/1000)%DURATION; renderFrame(Math.floor(t*FPS)/FPS); requestAnimationFrame(loop); })();
}
</script></body></html>
