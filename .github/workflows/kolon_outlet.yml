name: Kolon Outlet Watcher

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (KST 기준 매시간)
  workflow_dispatch:
  push:
    branches: [claude/kolon-outlet-bot]   # 테스트용: 전송/저장 없이 동작만 확인

permissions:
  contents: write

concurrency:
  group: kolon-outlet
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Probe (test only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python scripts/kolon_probe.py

      - name: Check outlet
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
          DEBUG_SHOTS: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python scripts/kolon_outlet_watcher.py

      - name: Upload debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kolon-debug
          path: debug/
          if-no-files-found: ignore

      - name: Commit seen list
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/kolon_outlet_seen.json
          git commit -m "Kolon outlet seen list update" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
