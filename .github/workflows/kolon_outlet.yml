name: Kolon Outlet Watcher

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (KST 기준 매시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kolon-outlet
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dateutil playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Check outlet
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KOLON_TELEGRAM_TOKEN: ${{ secrets.KOLON_TELEGRAM_TOKEN }}
          KOLON_TELEGRAM_CHAT_ID: ${{ secrets.KOLON_TELEGRAM_CHAT_ID }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/kolon_outlet_watcher.py

      - name: Commit seen list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/kolon_outlet_seen.json
          git commit -m "Kolon outlet seen list update" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
