<script>
const {

/* ══ 대화상자 · 파일 저장 (아티팩트 환경: 기본 confirm/prompt/다운로드가 막혀 있음) ══ */
function uiDialog(message, {
  input = false,
  def = "",
  okText = "확인",
  cancelText = "취소"
} = {}) {
  return new Promise(res => {
    const ov = document.createElement("div");
    ov.style.cssText = "position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px";
    const box = document.createElement("div");
    box.style.cssText = "background:#fff;border-radius:14px;max-width:420px;width:100%;padding:20px 18px 16px;font-family:'IBM Plex Sans KR',sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.25);color:#1A2420";
    const p = document.createElement("div");
    p.style.cssText = "font-size:14.5px;line-height:1.6;white-space:pre-wrap;margin-bottom:14px";
    p.textContent = message;
    box.appendChild(p);
    let inp = null;
    if (input) {
      inp = document.createElement("input");
      inp.type = "text";
      inp.inputMode = "decimal";
      inp.value = def == null ? "" : String(def);
      inp.style.cssText = "width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1px solid #E3E7E0;border-radius:8px;margin-bottom:14px;font-family:'IBM Plex Mono',monospace";
      box.appendChild(inp);
    }
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;justify-content:flex-end";
    const b1 = document.createElement("button");
    b1.textContent = cancelText;
    b1.style.cssText = "padding:9px 16px;border-radius:9px;border:1px solid #E3E7E0;background:#fff;font-weight:600;font-size:14px;cursor:pointer";
    const b2 = document.createElement("button");
    b2.textContent = okText;
    b2.style.cssText = "padding:9px 18px;border-radius:9px;border:none;background:#1E4D3B;color:#fff;font-weight:700;font-size:14px;cursor:pointer";
    row.appendChild(b1);
    row.appendChild(b2);
    box.appendChild(row);
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => {
      ov.remove();
      document.removeEventListener("keydown", kd);
      res(v);
    };
    const kd = e => {
      if (e.key === "Escape") done(input ? null : false);
      if (e.key === "Enter") done(input ? inp.value : true);
    };
    document.addEventListener("keydown", kd);
    b1.onclick = () => done(input ? null : false);
    b2.onclick = () => done(input ? inp.value : true);
    ov.onclick = e => {
      if (e.target === ov) done(input ? null : false);
    };
    setTimeout(() => {
      (inp || b2).focus();
      if (inp) inp.select();
    }, 30);
  });
}
const uiConfirm = m => uiDialog(m);
const uiPrompt = (m, d) => uiDialog(m, {
  input: true,
  def: d
});
let __dl = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => {
    __dl = d;
  }).catch(() => {});
}
async function saveFile(name, text) {
  if (__dl) {
    try {
      await __dl.save({
        filename: name,
        data: text
      });
      return "saved";
    } catch (e) {
      if (e && e.code === "declined") return "declined";
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    await uiDialog("파일 저장을 쓸 수 없어서 내용을 클립보드에 복사했어요.\n메모 앱이나 파일 앱에 붙여넣어 보관하세요.", {
      okText: "확인",
      cancelText: "닫기"
    });
    return "copied";
  } catch (e) {
    await uiDialog("파일 저장과 복사가 모두 막혀 있어요. 설정 탭의 '백업 텍스트 보기'를 이용해주세요.", {
      cancelText: "닫기"
    });
    return "fail";
  }
}

      return mem[k] || null;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, v);
    } catch (e) {
      mem[k] = v;
    }
  }

/* ══ 체결일 환율 자동 조회 (Frankfurter / ECB 기준, 무료·키 불필요) ══ */
const K_FXC = "max4x-fxcache";
const fxCache = (() => {
  try {
    return JSON.parse(store.get(K_FXC)) || {};
  } catch (e) {
    return {};
  }
})();
async function fetchFxRate(date) {
  if (!date) return null;
  if (fxCache[date]) return fxCache[date];
  try {
    const res = await fetch(`https://api.frankfurter.app/${date}?from=USD&to=KRW`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    const r = d && d.rates && d.rates.KRW;
    if (!r) throw new Error("no rate");
    fxCache[date] = r;
    try {
      store.set(K_FXC, JSON.stringify(fxCache));
    } catch (e) {}
    return r;
  } catch (e) {
    return null;
  }
}

  /* VR 목표 궤도: 첫 기록 총액(만원 환산) → goalYears년 뒤 goal(만원), 2주 복리 곡선 vs 실제 */
  const toManVr = x => vr.cur === "usd" ? x * curFx / 10000 : x;
  const vrGoal = useMemo(() => {
    if (!vrChartRows.length) return null;
    const first = vrChartRows[0];
    const S0 = toManVr(first.sum);
    const target = Number(vr.goal) || 100000;
    const years = Number(vr.goalYears) || 5;
    const steps = years * 26;
    if (!(S0 > 0) || !(target > S0)) return null;
    const i0 = first.i;
    const ratio = Math.pow(target / S0, 1 / steps);
    const labels = [],
      plan = [],
      act = [];
    for (let k = 0; k <= steps; k++) {
      labels.push(vrRowDate(i0 + k).slice(2));
      plan.push(Math.round(S0 * Math.pow(ratio, k)));
      const row = vrChartRows.find(x => x.i === i0 + k);
      act.push(row ? Math.round(toManVr(row.sum)) : null);
    }
    const lastK = vrChartRows[vrChartRows.length - 1].i - i0;
    const actNow = act[lastK],
      planNow = plan[lastK];
    return {
      labels,
      plan,
      act,
      S0,
      target,
      years,
      actNow,
      planNow,
      diff: actNow - planNow,
      diffPct: planNow > 0 ? (actNow / planNow - 1) * 100 : 0,
      milestones: [1, 2, 3, 4, 5].filter(y => y <= years).map(y => ({
        y,
        plan: plan[Math.min(steps, y * 26)],
        act: act[Math.min(steps, y * 26)]

    const nAt = d => {let n = Number(hist[0].n) || 6;hist.forEach(h => {if (h.date <= d) n = Number(h.n) || n;});return n;};

    const n = Number(u.n) || 6;const O = pvC.open;const invested = O && O.cum > 0 ? O.cum * O.avg : 0;
    return {unit, n, principal: unit * n, invested, unspent: Math.max(0, unit * n - invested)};

  /* 체인: qty 증가=매수(원금 투입·평단 갱신), 감소=매도(실현손익). 분배금액=보유수량×주당분배금

  const qdChartRows = useMemo(() => {
    const out = [];
    const startCost = (Number(qd.startQty) || 0) * (Number(qd.startAvg) || 0);
    let avg = Number(qd.startAvg) || 0,
      heldQty = Number(qd.startQty) || 0;
    let cumDist = 0,
      cumRealized = 0,
      hi = null,
      lo = null,
      startPrice = null;
    let invested = startCost;
    const injections = [];
    for (let i = 0; i < 156; i++) {
      const r = qd.rows[i];
      if (!r || !(r.price || r.dist || r.qty)) continue;
      const price = Number(r.price) || 0;
      const qty = r.qty !== "" && r.qty != null ? Number(r.qty) : heldQty;
      const dist = Number(r.dist) || 0;
      let realized = null,
        injected = 0;
      const dq = qty - heldQty;
      if (dq > 0 && price > 0) {
        injected = dq * price;
        invested += injected;
        injections.push({
          i,
          date: qdRowDate(i),
          qty: dq,
          price,
          amount: injected
        });
        avg = (avg * heldQty + price * dq) / (heldQty + dq);
      } else if (dq < 0 && price > 0) {
        realized = (price - avg) * -dq;
        cumRealized += realized;
      }
      heldQty = qty;
      const distAmount = heldQty * dist;
      cumDist += distAmount;
      if (price > 0) {

        lo = lo == null ? price : Math.min(lo, price);
      }
      const w = price > 0 ? dist / price : null; // 분배금/주가
      const annualRate = w != null ? w * 52 * 100 : null;
      const evalValue = heldQty * price;
      const unrealizedPL = price > 0 ? (price - avg) * heldQty : null;
      const priceChgPct = startPrice && price ? (price / startPrice - 1) * 100 : null;
      const totalValue = evalValue + cumDist + cumRealized; // 총가치 (자산+받은돈)
      const netProfit = totalValue - invested; // 순수익
      const recoveryPct = invested > 0 ? cumDist / invested * 100 : null; // 원금 회수율
      const navLoss = Math.max(0, avg - price) * heldQty; // 평단 대비 주가 손실액
      const coverage = navLoss > 0 ? cumDist / navLoss : null; // 분배금이 손실을 덮는 배수
      out.push({
        i,
        date: qdRowDate(i).slice(2),
        price,
        dist,
        qty: heldQty,
        avg,
        realized,
        cumRealized,
        distAmount,
        cumDist,
        w,
        annualRate,
        evalValue,
        unrealizedPL,
        priceChgPct,
        hi,
        lo,
        invested,
        injected,
        totalValue,
        netProfit,
        recoveryPct,
        navLoss,
        coverage
      });

    return {

    const netAfterTax = qdLatest.evalValue + cumDistAfterTax + qdLatest.cumRealized * (1 - qdTaxRate) - totalInvested;
    const totalReturnPost = totalInvested > 0 ? netAfterTax / totalInvested * 100 : null;

      netAfterTax,

      avgWeeklyDist,

  const [spMonth, setSpMonth] = useState(thisMonth());
  const [spDraft, setSpDraft] = useState({});
  const [spNew, setSpNew] = useState("");
  const p2Recs = all.p2.records;
  useEffect(() => {
    const r = p2Recs.find(x => x.month === spMonth);
    const d = {};
    S2.forEach(s => {
      const v = r ? sv(r, s.id) : null;
      d[s.id] = {
        stock: v && v.stock ? String(v.stock) : "",
        cash: v && v.cash ? String(v.cash) : ""
      };
    });
    setSpDraft(d);
  }, [spMonth, p2Recs, P2m.slots]);
  const spPrevRec = useMemo(() => [...p2Recs].filter(r => r.month < spMonth).pop() || null, [p2Recs, spMonth]);
  const saveP2Records = recs => {
    const sorted = [...recs].sort((a, b) => a.month.localeCompare(b.month));
    setAll(a => ({
      ...a,
      p2: {
        ...a.p2,
        records: sorted
      }
    }));
    store.set(key("p2", "records"), JSON.stringify(sorted));
    touch();
  };
  const saveSpouse = () => {
    const vals = {};
    S2.forEach(s => {
      const v = spDraft[s.id] || {};
      const pv = spPrevRec ? sv(spPrevRec, s.id) : {
        stock: 0,
        cash: 0
      };
      vals[s.id] = {
        stock: v.stock !== "" ? Number(v.stock) || 0 : pv.stock,
        cash: v.cash !== "" ? Number(v.cash) || 0 : pv.cash
      };
    });
    const ex = p2Recs.find(r => r.month === spMonth) || {
      month: spMonth,
      note: "",
      invest: 0,
      fx: "",
      vals: {}
    };
    saveP2Records([...p2Recs.filter(r => r.month !== spMonth), {
      ...ex,
      vals: {
        ...ex.vals,
        ...vals
      }
    }]);
    flash(`${P2m.name} ${spMonth} 기록 저장 ✓`);
  };
  const setP2Slots = sl => saveMeta({
    ...meta,
    profiles: {
      ...meta.profiles,
      p2: {
        ...P2m,
        slots: sl
      }
    }
  });
  const addSpStock = () => {
    const n = spNew.trim();
    if (!n) return;
    if (S2.length >= MAX_SLOTS) {
      flash(`최대 ${MAX_SLOTS}개`);
      return;
    }
    setP2Slots([...S2, {
      id: "s" + Date.now(),
      name: n
    }]);
    setSpNew("");
  };
  const delSpStock = async sid => {
    const s = S2.find(x => x.id === sid);
    if (!s) return;
    if (!(await uiConfirm(`'${s.name}'을(를) 목록에서 뺄까요?\n지난 기록 숫자는 남지만 합계에서 빠져요.`))) return;
    setP2Slots(S2.filter(x => x.id !== sid));
  };
  const spSeries = useMemo(() => p2Recs.map(r => ({
    month: r.month,
    total: totalOf(r, S2),
    net: netOf(r, S2)
  })), [p2Recs, P2m.slots]);

  /* ── 나·배우자·총합 (연금 제외) ── */
  const famSeries = useMemo(() => {
    const S1 = asArr(meta.profiles.p1.slots);
    const r1 = all.p1.records,
      r2 = all.p2.records;
    const months = [...new Set([...r1.map(r => r.month), ...r2.map(r => r.month)])].sort();
    let l1 = null,
      l2 = null;
    return months.map(m => {
      const a = r1.find(r => r.month === m),
        b = r2.find(r => r.month === m);
      if (a) l1 = a;
      if (b) l2 = b;
      const v1 = l1 ? netOf(l1, S1) : 0,
        v2 = l2 ? netOf(l2, S2) : 0;
      return {
        m,
        v1,
        v2,
        t: v1 + v2,
        f1: !!a,
        f2: !!b
      };
    });
  }, [all, meta]);

  /* ── 부동산 ── */
  const rl = D.realty || DEF_REALTY;
  const saveRl = v => save("realty", v);
  const rc = asArr(rl.cands).find(c => c.id === rl.active) || asArr(rl.cands)[0] || null;
  const updC = (k, v) => {
    if (!rc) return;
    saveRl({
      ...rl,
      active: rc.id,
      cands: asArr(rl.cands).map(c => c.id === rc.id ? {
        ...c,
        [k]: v
      } : c)
    });
  };
  const addCand = () => {
    const c = newCand();
    saveRl({
      ...rl,
      cands: [...asArr(rl.cands), c],
      active: c.id
    });
  };
  const dupCand = () => {
    if (!rc) return;
    const c = {
      ...rc,
      id: "h" + Date.now(),
      name: rc.name + " (복사)"
    };
    saveRl({
      ...rl,
      cands: [...asArr(rl.cands), c],
      active: c.id
    });
  };
  const delCand = async () => {
    if (!rc) return;
    if (!(await uiConfirm(`'${rc.name}' 매물을 지울까요?`))) return;
    const cs = asArr(rl.cands).filter(c => c.id !== rc.id);
    saveRl({
      ...rl,
      cands: cs,
      active: cs[0] ? cs[0].id : null
    });
  };
  const calcRealty = c => {
    if (!c) return null;
    const price = Number(c.price) || 0;
    const loan = c.loan !== "" && c.loan != null ? Number(c.loan) || 0 : price * (Number(c.ltv) || 0) / 100;
    const sch = loanSchedule(loan, c.rate, Number(c.years) || 30, c.method, c.grace);
    const tax = acqTax(price, c),
      bro = brokerFee(price, c);
    const other = price * (Number(c.otherPct) || 0) / 100;
    const fees = tax.total + bro.fee * 1.1 + other;
    const need = price - loan + fees;
    const first = sch[0] || {
        pay: 0,
        it: 0
      },
      maxPay = sch.reduce((m, x) => Math.max(m, x.pay), 0);
    const totInt = sch.reduce((s, x) => s + x.it, 0);
    const yr1 = sch.slice(0, 12).reduce((s, x) => s + x.pay, 0);
    const dsr = (Number(c.income) || 0) > 0 ? yr1 / Number(c.income) * 100 : null;
    const cashHave = c.cash !== "" && c.cash != null ? Number(c.cash) || 0 : stats ? stats.net : 0;
    const years = [];
    for (let y = 1; y <= Math.ceil(sch.length / 12); y++) {
      const s = sch.slice((y - 1) * 12, y * 12);
      years.push({
        y,
        it: s.reduce((a, x) => a + x.it, 0),
        pr: s.reduce((a, x) => a + x.pr, 0),
        pay: s.reduce((a, x) => a + x.pay, 0),
        bal: s[s.length - 1].bal
      });
    }
    return {
      price,
      loan,
      ltvReal: price ? loan / price * 100 : 0,
      sch,
      tax,
      bro,
      other,
      fees,
      need,
      first,
      maxPay,
      totInt,
      yr1,
      dsr,
      cashHave,
      gap: cashHave - need,
      years,
      totPay: loan + totInt
    };
  };
  const rcc = useMemo(() => calcRealty(rc), [rc, stats]);

  /* ── 대출 ── */
  const LN = asArr((D.loans || {}).list);
  const saveLoans = list => save("loans", {
    list
  });
  const loanRows = useMemo(() => LN.filter(l => !l.closed).map(l => ({
    l,
    c: loanCalc(l)
  })), [D.loans]);
  const loanSum = useMemo(() => {
    const s = {
      bal: 0,
      int: 0,
      pay: 0,
      prin: 0,
      intInv: 0,
      balInv: 0,
      balHome: 0,
      left: 0
    };
    loanRows.forEach(({
      l,
      c
    }) => {
      s.bal += c.bal;
      s.int += c.int;
      s.pay += c.pay;
      s.prin += c.prin;
      s.left += c.totalIntLeft;
      if (l.deduct !== false && l.purpose !== "home") {
        s.intInv += c.int;
        s.balInv += c.bal;
      }
      if (l.purpose === "home") s.balHome += c.bal;
    });
    s.rate = s.bal ? loanRows.reduce((a, {
      l,
      c
    }) => a + c.bal * (Number(l.rate) || 0), 0) / s.bal : 0;
    return s;
  }, [loanRows]);
  // 달마다 투자 대출 이자(원, 추정): 대출 시작월 이후만
  const loanIntOfMonth = m => loanRows.reduce((s, {
    l,
    c
  }) => {
    if (l.deduct === false || l.purpose === "home") return s;
    if (l.start && l.start.slice(0, 7) > m) return s;
    if (l.maturity && l.maturity.slice(0, 7) < m) return s;
    return s + c.int;
  }, 0);
  const loanIntSince = d => {
    if (!d) return 0;
    let t = 0;
    const [y, mo] = d.split("-").map(Number);
    const now = thisMonth();
    for (let yy = y, mm = mo; `${yy}-${String(mm).padStart(2, "0")}` <= now; mm++) {
      if (mm > 12) {
        mm = 1;
        yy++;
      }
      const k = `${yy}-${String(mm).padStart(2, "0")}`;
      if (k > now) break;
      if (k === d.slice(0, 7)) continue;
      t += loanIntOfMonth(k);
    }
    return t;
  };
  const [lnEdit, setLnEdit] = useState(null);

  /* ── SOXL 단타 계좌 = SOXL무매(보유 평가) + 증권예수금(운용 현금). 월 성과는 확정 손익만 ── */
  const SOXL_IDS = useMemo(() => SLOTS.filter(s => s.id === "soxl" || /예수금/.test(s.name)).map(s => s.id), [SLOTS]);
  const pvRealM = useMemo(() => {
    const o = {};
    pvC.cycles.forEach(c => c.rows.forEach(t => {
      if (t.side !== "sell" || t.realized == null) return;
      const m = (t.date || "").slice(0, 7);
      if (m) o[m] = (o[m] || 0) + t.realized;
    }));
    return o;
  }, [pvC]);
  const perfOf = (a, b) => {
    // 달러: 의미 있는 성과 · SOXL 미확정 변동 · 환율효과(만원)
    const fxOf = r => Number(r.fx) || curFx || 1;
    const fa = fxOf(a),
      fb = fxOf(b),
      m = b.month;
    const inM = d => (d || "").slice(0, 7) === m;
    const flowSlot = sid => D.wds.filter(w => inM(w.date) && w.strat === sid).reduce((s, w) => s + (isIn(w) ? 1 : -1) * (Number(w.amount) || 0), 0);
    const flowsMan = D.wds.filter(w => inM(w.date)).reduce((s, w) => s + (isIn(w) ? 1 : -1) * (Number(w.amount) || 0), 0) + (Number(b.invest) || 0);
    const bkAmt = bk.purchases.filter(p => p.month === m).reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.price) || 0), 0);
    const parts = SLOTS.filter(s => !isLocked(s) && !SOXL_IDS.includes(s.id)).map(s => {
      let v = slotTotal(b, s.id) * 1e4 / fb - slotTotal(a, s.id) * 1e4 / fa - flowSlot(s.id) * 1e4 / fb;
      if (s.id === "basket") v -= bkAmt;
      return {
        id: s.id,
        name: s.name,
        v,
        col: slotColor(s.id)
      };
    });
    const pvReal = pvRealM[m] || 0;
    parts.push({
      id: "__pv",
      name: "SOXL 단타 (확정)",
      v: pvReal,
      col: "#C0392B"
    });
    const bucketA = SOXL_IDS.reduce((s, id) => s + slotTotal(a, id), 0),
      bucketB = SOXL_IDS.reduce((s, id) => s + slotTotal(b, id), 0);
    const bucketFlow = SOXL_IDS.reduce((s, id) => s + flowSlot(id), 0);
    const unassignedFlow = flowsMan - (Number(b.invest) || 0) - SLOTS.filter(s => !isLocked(s)).reduce((s, x) => s + flowSlot(x.id), 0);
    const pending = bucketB * 1e4 / fb - bucketA * 1e4 / fa - (bucketFlow + unassignedFlow + (Number(b.invest) || 0)) * 1e4 / fb + bkAmt - pvReal; // 사이클 중 평가 변동(미확정)
    const inv = parts.reduce((s, p) => s + p.v, 0);
    const netA = netOf(a, SLOTS),
      netB = netOf(b, SLOTS);
    const fxEffMan = netB - netA - flowsMan - (inv + pending) * fb / 1e4;
    const netUA = netA * 1e4 / fa;
    const den = netUA + 0.5 * flowsMan * 1e4 / fb;
    const intUsd = loanIntOfMonth(m) / fb;
    return {
      fa,
      fb,
      flowsMan,
      bkAmt,
      parts,
      pvReal,
      pending,
      inv,
      intUsd,
      fxEffMan,
      ret: den > 0 ? (inv - intUsd) / den * 100 : null,
      retGross: den > 0 ? inv / den * 100 : null,
      bucketA,
      bucketB,
      bucketFlow
    };
  };

  /* ── 월수익률 (달러 기준, 입출금 제외) ── */
  const mret = useMemo(() => {
    const recs = D.records;
    const fxOf = r => Number(r.fx) || curFx || 1;
    const out = {
      net: [],
      bk: [],
      vr: [],
      pv: []
    };
    const flowM = (m, strat) => D.wds.filter(w => (w.date || "").slice(0, 7) === m && (!strat || w.strat === strat)).reduce((s, w) => s + (isIn(w) ? 1 : -1) * (Number(w.amount) || 0), 0);
    const dietz = (V0, V1, F) => {
      const den = V0 + 0.5 * F;
      return den > 0 ? (V1 - V0 - F) / den * 100 : null;
    };
    for (let i = 1; i < recs.length; i++) {
      const a = recs[i - 1],
        b = recs[i];
      const fb = fxOf(b);
      out.net.push({
        m: b.month,
        r: perfOf(a, b).ret
      });
      const B0 = slotTotal(a, "basket") * 1e4 / fxOf(a),
        B1 = slotTotal(b, "basket") * 1e4 / fb;
      const BF = bk.purchases.filter(p => p.month === b.month).reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.price) || 0), 0) + flowM(b.month, "basket") * 1e4 / fb;
      if (B0 > 0) out.bk.push({
        m: b.month,
        r: dietz(B0, B1, BF)
      });
    }
    // 거치식: 사이클 기록의 월말 TOTAL
    const vm = {};
    vrChartRows.forEach(r => {
      if (!r.date || !r.sum) return;
      const m = (r.date.length === 8 ? "20" : "") + r.date.slice(0, r.date.length === 8 ? 5 : 7);
      vm[m] = r.sum;
    });
    const vk = Object.keys(vm).sort();
    for (let i = 1; i < vk.length; i++) out.vr.push({
      m: vk[i],
      r: (vm[vk[i]] / vm[vk[i - 1]] - 1) * 100
    });
    // SOXL: 그 달 매도로 확정한 손익 ÷ 싸이클 원금
    const pm = {};
    pvC.cycles.forEach(c => c.rows.forEach(t => {
      if (t.side !== "sell" || t.realized == null) return;
      const m = (t.date || "").slice(0, 7);
      if (!m) return;
      pm[m] = pm[m] || {
        p: 0,
        base: c.principal
      };
      pm[m].p += t.realized;
      pm[m].base = Math.max(pm[m].base, c.principal);
    }));
    Object.keys(pm).sort().forEach(m => out.pv.push({
      m,
      r: pm[m].base > 0 ? pm[m].p / pm[m].base * 100 : null
    }));
    const sum = a => {
      const v = a.filter(x => x.r != null && isFinite(x.r));
      if (!v.length) return null;
      const g = Math.pow(v.reduce((p, x) => p * (1 + x.r / 100), 1), 1 / v.length) - 1;
      const yr = v[v.length - 1].m.slice(0, 4),
        yv = v.filter(x => x.m.slice(0, 4) === yr);
      return {
        last: v[v.length - 1],
        avg: g * 100,
        n: v.length,
        ytd: (yv.reduce((p, x) => p * (1 + x.r / 100), 1) - 1) * 100,
        ytdFrom: yv[0].m,
        yr,
        cum: (v.reduce((p, x) => p * (1 + x.r / 100), 1) - 1) * 100,
        cumFrom: v[0].m
      };
    };
    return {
      net: sum(out.net),
      bk: sum(out.bk),
      vr: sum(out.vr),
      pv: sum(out.pv),
      raw: out
    };
  }, [D.records, D.wds, SLOTS, bk.purchases, vrChartRows, pvC, curFx, SOXL_IDS, pvRealM]);

  /* ── 월간 성적표 ── */
  const sg2 = v => v >= 0 ? "+" : "-";
  const r0 = v => Math.abs(v || 0) > 1e-9;
  const reports = useMemo(() => {
    const recs = D.records;
    const fxOf = r => Number(r.fx) || curFx || 1;
    const out = [];
    const nowM = thisMonth();
    const inM = (d, m) => (d || "").slice(0, 7) === m;
    for (let i = 1; i < recs.length; i++) {
      const a = recs[i - 1],
        b = recs[i];
      const m = b.month;
      if (m < REPORT_FROM) continue;
      const fa = fxOf(a),
        fb = fxOf(b);
      const netA = netOf(a, SLOTS),
        netB = netOf(b, SLOTS),
        totA = totalOf(a, SLOTS),
        totB = totalOf(b, SLOTS);
      const netUA = netA * 1e4 / fa,
        netUB = netB * 1e4 / fb;
      const dep = D.wds.filter(w => isIn(w) && inM(w.date, m)),
        wdl = D.wds.filter(w => !isIn(w) && inM(w.date, m));
      const depS = dep.reduce((s, w) => s + (Number(w.amount) || 0), 0) + (Number(b.invest) || 0),
        wdS = wdl.reduce((s, w) => s + (Number(w.amount) || 0), 0);
      const netRet = perfOf(a, b).ret;
      const slots = [...SLOTS.filter(s => !SOXL_IDS.includes(s.id)).map(s => {
        const va = slotTotal(a, s.id),
          vb = slotTotal(b, s.id);
        return {
          id: s.id,
          name: s.name,
          locked: isLocked(s),
          va,
          vb,
          d: vb - va,
          wa: totA ? va / totA * 100 : 0,
          wb: totB ? vb / totB * 100 : 0
        };
      }), (() => {
        const va = SOXL_IDS.reduce((s, id) => s + slotTotal(a, id), 0),
          vb = SOXL_IDS.reduce((s, id) => s + slotTotal(b, id), 0);
        return {
          id: "soxl",
          name: "예수금 계좌 (SOXL·QDTE·VR Pool)",
          locked: false,
          va,
          vb,
          d: vb - va,
          wa: totA ? va / totA * 100 : 0,
          wb: totB ? vb / totB * 100 : 0
        };
      })()].filter(s => s.va || s.vb);
      const up = slots.filter(s => s.d > 0).sort((x, y) => y.d - x.d),
        dn = slots.filter(s => s.d < 0).sort((x, y) => x.d - y.d);
      // 매매법
      let vrR = (mret.raw.vr.find(x => x.m === m) || {}).r;
      const bkR = (mret.raw.bk.find(x => x.m === m) || {}).r,
        pvR = (mret.raw.pv.find(x => x.m === m) || {}).r;
      const vrRows = vrChartRows.filter(r => r.date && "20" + r.date.slice(0, 5) === m);
      const vrTrades = vrRows.reduce((s, r) => s + (Number(r.trade) || 0), 0);
      const bkBuys = bk.purchases.filter(p => p.month === m);
      const bkQty = bkBuys.reduce((s, p) => s + (Number(p.qty) || 0), 0),
        bkAmt = bkBuys.reduce((s, p) => s + (Number(p.qty) || 0) * (Number(p.price) || 0), 0);
      const bkHvM = bkHv.filter(h => inM(h.date, m) || h.month === m);
      let pvSells = 0,
        pvReal = 0,
        pvCloses = [];
      pvC.cycles.forEach(c => {
        c.rows.forEach(t => {
          if (t.side === "sell" && inM(t.date, m)) {
            pvSells++;
            pvReal += t.realized || 0;
          }
        });
        if (c.closed && inM(c.endDate, m)) pvCloses.push(c);
      });
      const qdM = qdRows.filter(r => ("20" + (r.date || "")).slice(0, 7) === m);
      const qdDist = qdM.reduce((s, r) => s + (Number(r.dist) || 0) * (Number(r.qty) || 0), 0);
      // 등급 (달러 월수익률)
      const g = netRet == null ? "–" : netRet >= 8 ? "A+" : netRet >= 4 ? "A" : netRet >= 1 ? "B+" : netRet >= 0 ? "B" : netRet >= -3 ? "C" : netRet >= -8 ? "D" : "F";
      // ── 분석 ──
      const flows = depS - wdS;
      const P = perfOf(a, b);
      const attrib = P.parts.filter(p => Math.abs(p.v) >= 1 || slotTotal(b, p.id) || p.id === "__pv").map(p => [p.name, p.v, p.col, p.id]);
      if (P.intUsd > 0) attrib.push(["대출 이자", -P.intUsd, "#8A8F8C", "__loan"]);
      const intUsd = P.intUsd,
        intMan = P.intUsd * fb / 1e4;
      const invUsd = P.inv,
        invMan = P.inv * fb / 1e4,
        realUsd = P.inv - P.intUsd,
        fxEffectMan = P.fxEffMan,
        pendingUsd = P.pending,
        pendingMan = P.pending * fb / 1e4;
      /* (tqqq·SOXL 분리는 아래에서 계산) */
      const bucketA = P.bucketA,
        bucketB = P.bucketB;
      const monthEnd = (rows, mm) => {
        const r = rows.filter(x => x.date && "20" + x.date.slice(0, 5) === mm);
        return r.length ? r[r.length - 1] : null;

      const vE = monthEnd(vrChartRows, m),
